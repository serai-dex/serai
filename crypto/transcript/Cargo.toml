[package]
name = "flexible-transcript"
version = "0.3.4"
description = "A simple transcript trait definition, along with viable options"
license = "MIT"
repository = "https://github.com/serai-dex/serai/tree/develop/crypto/transcript"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
keywords = ["transcript"]
edition = "2024"
rust-version = "1.85"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
zeroize = { version = "1.5", default-features = false }

digest = { version = "0.11", default-features = false }

blake2 = { version = "0.11", default-features = false, features = ["zeroize"], optional = true }
merlin = { version = "3", default-features = false, optional = true }

[dev-dependencies]
sha2 = { version = "0.11", default-features = false }
blake2 = { version = "0.11", default-features = false }

[features]
std = ["zeroize/std", "merlin?/std"]
merlin = ["dep:merlin"]
recommended = ["dep:blake2"]
tests = []
default = ["std"]
