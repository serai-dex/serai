[package]
name = "multiexp"
version = "0.4.2"
description = "Multiexponentiation algorithms for ff/group"
license = "MIT"
repository = "https://github.com/serai-dex/serai/tree/develop/crypto/multiexp"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
keywords = ["multiexp", "ff", "group"]
edition = "2021"
rust-version = "1.81"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
zeroize = { version = "1.5", default-features = false, features = ["zeroize_derive"] }
subtle = { version = "2.4", default-features = false }

ff = { version = "0.13", default-features = false, features = ["bits"] }
group = { version = "0.13", default-features = false }

rand_core = { version = "0.6", default-features = false, optional = true }

[dev-dependencies]
rand_core = { version = "0.6", features = ["std"] }

k256 = { version = "0.13.1", default-features = false, features = ["arithmetic", "bits"] }
dalek-ff-group = { path = "../dalek-ff-group" }

[features]
alloc = ["zeroize/alloc"]
std = ["alloc", "zeroize/std", "subtle/std", "ff/std", "rand_core?/std"]

batch = ["alloc", "dep:rand_core"]

default = ["std"]
