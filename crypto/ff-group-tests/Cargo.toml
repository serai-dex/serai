[package]
name = "ff-group-tests"
version = "0.13.1"
description = "A collection of sanity tests for implementors of ff/group APIs"
license = "MIT"
repository = "https://github.com/serai-dex/serai/tree/develop/crypto/ff-group-tests"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
keywords = ["ff", "group", "ecc"]
edition = "2021"
rust-version = "1.79"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
rand_core = "0.9"

subtle = "^2.4"

ff = { version = "0.14.0-pre.0", features = ["bits"] }
group = "0.14.0-pre.0"

[dev-dependencies]
k256 = { version = "^0.13.1", default-features = false, features = ["std", "arithmetic", "bits"] }
p256 = { version = "^0.13.1", default-features = false, features = ["std", "arithmetic", "bits"] }

bls12_381 = "0.8"

pasta_curves = { git = "https://github.com/kayabaNerve/pasta_curves", rev = "a46b5be95cacbff54d06aad8d3bbcba42e05d616" }
