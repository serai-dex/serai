[package]
name = "schnorr-signatures"
version = "0.5.2"
description = "Minimal Schnorr signatures crate hosting common code"
license = "MIT"
repository = "https://github.com/serai-dex/serai/tree/develop/crypto/schnorr"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
keywords = ["schnorr", "ff", "group"]
edition = "2024"
rust-version = "1.85"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-machete]
ignored = ["zeroize_derive"]

[lints]
workspace = true

[dependencies]
std-shims = { path = "../../common/std-shims", version = "0.1.1", default-features = false }

rand_core = { version = "0.6", default-features = false }

# `zeroize_derive 1.3.3, 1.4.1` fixes deriving `Zeroize` for structs with generic parameters
zeroize_derive = { version = "1.4.1", default-features = false }
zeroize = { version = "1.5", default-features = false, features = ["zeroize_derive"] }

transcript = { package = "flexible-transcript", path = "../transcript", version = "0.3.2", default-features = false, optional = true }

ciphersuite = { path = "../ciphersuite", version = "0.4.1", default-features = false }
multiexp = { path = "../multiexp", version = "0.5", default-features = false }

[dev-dependencies]
hex = "0.4"

rand_core = { version = "0.6", features = ["std"] }

sha2 = { version = "0.11", default-features = false, features = ["alloc"] }

dalek-ff-group = { path =  "../dalek-ff-group" }
ciphersuite = { path = "../ciphersuite" }

[features]
alloc = ["zeroize/alloc", "ciphersuite/alloc", "multiexp/alloc", "multiexp/batch"]
aggregate = ["alloc", "dep:transcript"]
std = ["alloc", "std-shims/std", "rand_core/std", "zeroize/std", "transcript?/std", "ciphersuite/std", "multiexp/std"]
default = ["std"]
