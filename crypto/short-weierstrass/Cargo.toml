[package]
name = "short-weierstrass"
version = "0.1.0"
description = "A library for working with curves in a short Weierstrass form"
license = "MIT"
repository = "https://github.com/serai-dex/serai/tree/develop/crypto/short-weierstrass"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
keywords = ["ff", "group", "elliptic-curve", "weierstrass"]
edition = "2021"
rust-version = "1.81"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-machete]
ignored = ["tap", "zeroize_derive"]

[lints]
workspace = true

[dependencies]
zeroize = { version = "1.5", default-features = false }
subtle = { version = "2.5", default-features = false }
rand_core = { version = "0.6", default-features = false }

# `ff` requires `bitvec` requires `wyz 0.5.0` which requires `tap 1.0.1` but only specifies `tap 1.0.0`
tap = { version = "1.0.1", default-features = false }
ff = { version = "0.13", default-features = false, features = ["bits"] }
group = { version = "0.13", default-features = false }

# `zeroize_derive 1.3.3` fixes deriving `ZeroizeOnDrop` for structs with generics, as `ec-divisors` does
zeroize_derive = { version = "1.3.3", default-features = false }
ec-divisors = { git = "https://github.com/monero-oxide/monero-oxide", rev = "a5eb3c23f77c4e9c75fa9406dfdbfe63bff4cb3a", default-features = false, optional = true }

[features]
alloc = ["zeroize/alloc", "rand_core/alloc", "ff/alloc", "group/alloc", "dep:ec-divisors"]
std = ["alloc", "zeroize/std", "subtle/std", "rand_core/std", "ff/std"]
default = ["std"]
