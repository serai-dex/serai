[package]
name = "short-weierstrass"
version = "0.1.0"
description = "A library for working with curves in a short Weierstrass form"
license = "MIT"
repository = "https://github.com/serai-dex/serai/tree/develop/crypto/short-weierstrass"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
keywords = ["ff", "group", "elliptic-curve", "weierstrass"]
edition = "2021"
rust-version = "1.81"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
zeroize = { version = "1.5", default-features = false }
subtle = { version = "2.5", default-features = false }
rand_core = { version = "0.6", default-features = false }

ff = { version = "0.13", default-features = false, features = ["bits"] }
group = { version = "0.13", default-features = false }

ec-divisors = { git = "https://github.com/monero-oxide/monero-oxide", rev = "31c26d96eaadbba910ffe3613ad8b4cf9c598a93", default-features = false, optional = true }

[features]
alloc = ["zeroize/alloc", "rand_core/alloc", "ff/alloc", "group/alloc", "dep:ec-divisors"]
std = ["alloc", "zeroize/std", "subtle/std", "rand_core/std", "ff/std"]
default = ["std"]
