[package]
name = "serai-message-queue-server"
version = "0.1.0"
description = "Serai's message queue's server"
license = "AGPL-3.0-only"
repository = "https://github.com/serai-dex/serai/tree/develop/message-queue/server"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
keywords = []
edition = "2021"
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
hex = { version = "0.4", default-features = false, features = ["std"] }
borsh = { version = "1", default-features = false, features = ["std", "derive", "de_strict_order"] }

dalek-ff-group = { path = "../../crypto/dalek-ff-group", default-features = false, features = ["std"] }
ciphersuite = { path = "../../crypto/ciphersuite", default-features = false, features = ["std"] }

tokio = { version = "1", default-features = false, features = ["rt", "time", "io-util", "net", "macros"] }

zalloc = { path = "../../common/zalloc" }
serai-db = { path = "../../common/db", default-features = false, features = ["std", "schema"] }

serai-env = { path = "../../secret-store/env" }

serai-primitives = { path = "../../substrate/primitives", default-features = false, features = ["std"] }
message-queue = { package = "serai-message-queue", path = "../../message-queue", default-features = false }

[features]
parity-db = ["serai-db/parity-db"]
rocksdb = ["serai-db/rocksdb"]
