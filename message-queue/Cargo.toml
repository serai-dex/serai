[package]
name = "serai-message-queue"
version = "0.1.0"
description = "The core of Serai's message queue"
license = "AGPL-3.0-only"
repository = "https://github.com/serai-dex/serai/tree/develop/message-queue"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
keywords = []
edition = "2024"
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
zeroize = { version = "1", default-features = false, features = ["std"] }
rand_core = { version = "0.6", default-features = false, features = ["std"] }

transcript = { package = "flexible-transcript", path = "../crypto/transcript", default-features = false, features = ["std"] }
ciphersuite = { path = "../crypto/ciphersuite", default-features = false, features = ["std"] }
dalek-ff-group = { path = "../crypto/dalek-ff-group", default-features = false, features = ["std"] }
schnorr-signatures = { path = "../crypto/schnorr", default-features = false, features = ["std"] }

borsh = { version = "1", default-features = false, features = ["std", "derive", "de_strict_order"] }

serai-primitives = { path = "../substrate/primitives", default-features = false, features = ["std"] }
