[[audits.rustc-hex]]
who = "Luke Parker <lukeparker5132@gmail.com>"
criteria = "safe-to-deploy"
version = "2.99.99"
notes = """
`rustc-hex` is used for a single `struct`, as confirmed by the compiler
accepting a `rustc-hex` which only provides said single `struct`. The provided
implementation is minimal, tested, with the CI continually running tests on it.
The replacement is zero-dependency and avoids a potential issue in the upstream
`rustc-hex`, where non-hex characters were directly present in the `Display`
implementation for `FromHexError`.
"""

