[[audits.arrayref]]
who = "Luke Parker <lukeparker5132@gmail.com>"
criteria = "safe-to-deploy"
version = "0.3.9"
notes = """
As of Rust 1.93.0, there's `<[T]>::as_array` and `<[T]>::as_mut_array` which
would be eligible to replace `array_ref!` and `array_mut_ref!` without
`unsafe`. The only caveat would be how this bound-checks when taking the slice,
then uses `unsafe` to cast to an array, while the `std` library option would
bound-check when taking the slice _and_ check the length when casting (though
this may be trivially optimized out).

While I would add such a patch, that wouldn't cover the `array_refs!`,
`mut_array_refs!` macros.
"""

[[audits.asn1-rs-impl]]
who = "Luke Parker <lukeparker5132@gmail.com>"
criteria = "safe-to-deploy"
version = "0.2.0"
notes = """
This seems like a straightforward proc macro to convert a formatted input into
an array. I am unfamiliar with the OID format and cannot comment this to be
sound, and it appears to lack extensive testing, but the macro itself seems
reasonable (even if using far too many dependencies) and the output safe.
"""

