[[audits.multihash-codetable]]
who = "Luke Parker <lukeparker5132@gmail.com>"
criteria = "safe-to-deploy"
version = "0.2.2"
notes = """
I did not confirm the provided codetable follows any intended specification.

This uses `max` to index a slice for RustCrypto-backed hashes and for
`blake2b_simd`-backed hashes, when I believe it should be `min`. This doesn't
matter for the RustCrypto-backed hashes, as they're exactly sized, and doesn't
matter for the `blake2b_simd`-backed hashes, as the `as_bytes` method provides
an output of length equal to the requested output length. This makes the `max`
call pointless (as both operands are equal), but it still seems invalid.
"""

