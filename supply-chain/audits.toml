[[audits.alloy-eips]]
who = "Luke Parker <lukeparker5132@gmail.com>"
criteria = "safe-to-deploy"
delta = "2.0.1 -> 2.0.4"
notes = """
I am not commenting on the soundness of this. The library's FFI-ish code with
`c-kzg` (when the `kzg` feature is enabled) is questionable:
https://github.com/alloy-rs/alloy/issues/3950.  This is being accepted as not
only do we not use the `kzg` feature, but we actually have `c-kzg` patched to
an empty crate, proving we never even attempt to compile it
(`/patches/ethereum/c-kzg`). That guarantees it's a non-issue within our
context.
"""

[[audits.alloy-eips]]
who = "Luke Parker <lukeparker5132@gmail.com>"
criteria = "safe-to-deploy"
delta = "2.0.4 -> 2.0.5"
notes = """
We don't use the `kzg` feature, as proven by `patches/ethereum/c-kzg` being a
stub which is never compiled. However, I'm not convinced about the technical
safety of these `unsafe` blocks, as I raised
[here](https://github.com/alloy-rs/alloy/issues/3950). Specifically, this is
casting a type with the layout of a Rust array to a C struct wrapping an array,
the latter completely and arbitrarily defined by the C ABI. `transmute` does
ensure the sizes are the same, but there's no assertions for the types'
alignment and references are casted.

This at least consolidates a variety of historical `unsafe` blocks though.
"""

