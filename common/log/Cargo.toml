[package]
name = "serai-log"
version = "0.1.0"
description = "Coverage-gated logging macros for the Serai project"
license = "AGPL-3.0-only"
repository = "https://github.com/serai-dex/serai/tree/develop/common/log"
authors = ["Luke Parker <lukeparker5132@gmail.com>", "rafael_xmr <g.pi8ax@slmail.me>"]
keywords = []
edition = "2021"
publish = false
rust-version = "1.64"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
log = { version = "0.4", default-features = false, features = ["std"] }
