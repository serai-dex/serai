[package]
name = "serai-genesis-liquidity-pallet"
version = "0.1.0"
description = "Genesis Liquidity pallet for Serai"
license = "AGPL-3.0-only"
repository = "https://github.com/serai-dex/serai/tree/develop/substrate/genesis-liquidity"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
edition = "2021"
rust-version = "1.85"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-machete]
ignored = ["scale"]

[lints]
workspace = true

[dependencies]
scale = { package = "parity-scale-codec", version = "3", default-features = false, features = ["derive"] }

sp-core = { git = "https://github.com/serai-dex/patch-polkadot-sdk", default-features = false }
sp-application-crypto = { git = "https://github.com/serai-dex/patch-polkadot-sdk", default-features = false }

frame-support = { git = "https://github.com/serai-dex/patch-polkadot-sdk", default-features = false }
frame-system = { git = "https://github.com/serai-dex/patch-polkadot-sdk", default-features = false }

serai-abi = { path = "../abi", default-features = false, features = ["substrate"] }
serai-core-pallet = { path = "../core", default-features = false }
serai-coins-pallet = { path = "../coins", default-features = false }
serai-dex-pallet = { path = "../dex", default-features = false }
serai-validator-sets-pallet = { path = "../validator-sets", default-features = false }

bitvec = { version = "1", default-features = false, features = ["alloc"], optional = true }
pallet-timestamp = { git = "https://github.com/serai-dex/patch-polkadot-sdk", default-features = false, optional = true }
frame-benchmarking = { git = "https://github.com/serai-dex/patch-polkadot-sdk", default-features = false, optional = true }

[dev-dependencies]
rand_core = { version = "0.6", default-features = false, features = ["std"] }

bitvec = { version = "1", default-features = false, features = ["alloc", "std"] }
borsh = { version = "1", default-features = false, features = ["std", "derive", "de_strict_order"] }

ciphersuite = { path = "../../crypto/ciphersuite", default-features = false, features = ["alloc", "std"] }
dalek-ff-group = { path = "../../crypto/dalek-ff-group", default-features = false, features = ["alloc", "std"] }
schnorrkel = { version = "0.11", default-features = false, features = ["alloc", "std"] }
dkg-musig = { path = "../../crypto/dkg/musig", default-features = false, features = ["std"] }

sp-core = { git = "https://github.com/serai-dex/patch-polkadot-sdk", default-features = false, features = ["std"] }
sp-io = { git = "https://github.com/serai-dex/patch-polkadot-sdk", default-features = false, features = ["std"] }
sp-keyring = { git = "https://github.com/serai-dex/patch-polkadot-sdk", default-features = false, features = ["std"] }

pallet-timestamp = { git = "https://github.com/serai-dex/patch-polkadot-sdk", default-features = false, features = ["std"] }

[features]
std = [
  "scale/std",

  "sp-core/std",
  "sp-application-crypto/std",

  "frame-support/std",
  "frame-system/std",

  "serai-abi/std",
  "serai-core-pallet/std",
  "serai-coins-pallet/std",
  "serai-dex-pallet/std",
  "serai-validator-sets-pallet/std",

  "bitvec?/std",
  "pallet-timestamp?/std",
  "frame-benchmarking?/std",
]

try-runtime = [
  "frame-support/try-runtime",
  "frame-system/try-runtime",

  "serai-abi/try-runtime",
  "serai-core-pallet/try-runtime",
  "serai-coins-pallet/try-runtime",
  "serai-dex-pallet/try-runtime",
  "serai-validator-sets-pallet/try-runtime",
]

runtime-benchmarks = [
  "frame-support/runtime-benchmarks",
  "frame-system/runtime-benchmarks",

  "serai-core-pallet/runtime-benchmarks",
  "serai-coins-pallet/runtime-benchmarks",
  "serai-dex-pallet/runtime-benchmarks",
  "serai-validator-sets-pallet/runtime-benchmarks",

  "bitvec",
  "pallet-timestamp",
  "frame-benchmarking/runtime-benchmarks",
]

default = ["std"]
