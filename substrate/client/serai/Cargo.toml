[package]
name = "serai-client-serai"
version = "0.1.0"
description = "A client for the Serai network itself"
license = "MIT"
repository = "https://github.com/serai-dex/serai/tree/develop/substrate/client/serai"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
keywords = ["serai"]
edition = "2021"
rust-version = "1.91"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
thiserror = { version = "2", default-features = false, features = ["std"] }
core-json-traits = { version = "0.4", default-features = false, features = ["alloc"] }
core-json-derive = { version = "0.4", default-features = false }
simple-request = { path = "../../../common/request", version = "0.3" }

hex = { version = "0.4", default-features = false, features = ["alloc"] }
borsh = { version = "1", default-features = false, features = ["std"] }

serai-abi = { path = "../../abi", version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
blake2 = { version = "0.11.0-rc.5", default-features = false }
sp-core = { git = "https://github.com/serai-dex/patch-polkadot-sdk" }

tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
dockertest = "0.5"
serai-docker-tests = { path = "../../../tests/docker" }
serai-substrate-tests = { path = "../../../tests/substrate" }
