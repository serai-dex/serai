[package]
name = "keccak-asm"
version = "0.1.99"
description = "Patch keccak-asm to sha3"
license = "MIT"
repository = "https://github.com/serai-dex/serai/tree/develop/patches/keccask-asm"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
keywords = []
edition = "2021"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]

[dependencies]
sha3 = { version = "0.10", default-features = false }

[features]
zeroize = ["sha3/zeroize"]
std = ["sha3/std"]
