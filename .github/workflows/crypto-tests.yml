name: crypto/ Tests

on:
  push:
    branches:
      - develop
    paths:
      - "common/**"
      - "crypto/**"

  pull_request:
    paths:
      - "common/**"
      - "crypto/**"

  workflow_dispatch:

jobs:
  test-crypto:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # 6.0.0

      - name: Build Dependencies
        uses: ./.github/actions/build-dependencies

      - name: Run Tests
        run: |
          cargo test --all-features \
            -p flexible-transcript \
            -p ff-group-tests \
            -p dalek-ff-group \
            -p minimal-ed448 \
            -p ciphersuite \
            -p ciphersuite-kp256 \
            -p multiexp \
            -p schnorr-signatures \
            -p prime-field \
            -p short-weierstrass \
            -p secq256k1 \
            -p embedwards25519 \
            -p dkg \
            -p dkg-recovery \
            -p dkg-dealer \
            -p dkg-musig \
            -p dkg-evrf \
            -p modular-frost \
            -p frost-schnorrkel
