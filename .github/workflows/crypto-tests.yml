name: crypto/ Tests

on:
  push:
    branches:
      - develop
    paths:
      - "common/**"
      - "crypto/**"

  pull_request:
    paths:
      - "common/**"
      - "crypto/**"

  workflow_dispatch:

jobs:
  test-crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac

      - name: Build Dependencies
        uses: ./.github/actions/build-dependencies

      - name: Run Tests
        run: |
          GITHUB_CI=true RUST_BACKTRACE=1 cargo test --all-features \
            -p flexible-transcript \
            -p ff-group-tests \
            -p dalek-ff-group \
            -p minimal-ed448 \
            -p ciphersuite \
            -p ciphersuite-kp256 \
            -p multiexp \
            -p schnorr-signatures \
            -p prime-field \
            -p short-weierstrass \
            -p secq256k1 \
            -p embedwards25519 \
            -p dkg \
            -p dkg-recovery \
            -p dkg-dealer \
            -p dkg-musig \
            -p dkg-evrf \
            -p modular-frost \
            -p frost-schnorrkel
