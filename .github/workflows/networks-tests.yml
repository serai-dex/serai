name: networks/ Tests

on:
  push:
    branches:
      - develop
      - next
    paths:
      - "common/**"
      - "crypto/**"
      - "networks/**"

  pull_request:
    paths:
      - "common/**"
      - "crypto/**"
      - "networks/**"

  workflow_dispatch:

jobs:
  test-bitcoin:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26-intel, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # 6.0.0

      - name: Test Dependencies
        uses: ./.github/actions/test-dependencies

      - name: Run Tests
        run: cargo test --all-features -p bitcoin-serai

  test-ethereum:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-26-intel, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # 6.0.0

      - name: Test Dependencies
        uses: ./.github/actions/test-dependencies

      - name: Run Tests
        shell: bash
        run: |
          find ./networks/ethereum -name "Cargo.toml" | while IFS="\n" read -r manifest; do
            cargo test --all-features --manifest-path $manifest
          done
