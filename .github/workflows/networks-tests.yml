name: networks/ Tests
permissions: {}

on:
  push:
    branches:
      - develop
      - next
    paths:
      - "common/**"
      - "crypto/**"
      - "networks/**"

  pull_request:
    paths:
      - "common/**"
      - "crypto/**"
      - "networks/**"

  workflow_dispatch:

jobs:
  test-bitcoin:
    name: Test `networks/bitcoin` crates

    strategy:
      matrix:
        os: [ubuntu-latest, macos-26-intel, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Test Dependencies
        uses: ./.github/actions/test-dependencies

      - name: Run Tests
        shell: bash
        run: |
          find ./networks/bitcoin -name "Cargo.toml" | while IFS="\n" read -r manifest; do
            cargo test --all-features --manifest-path "$manifest"
          done

  test-ethereum:
    name: Test `networks/ethereum` crates

    strategy:
      matrix:
        os: [ubuntu-latest, macos-26-intel, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Test Dependencies
        uses: ./.github/actions/test-dependencies

      - name: Run Tests
        shell: bash
        run: |
          find ./networks/ethereum -name "Cargo.toml" | while IFS="\n" read -r manifest; do
            cargo test --all-features --manifest-path "$manifest"
          done
