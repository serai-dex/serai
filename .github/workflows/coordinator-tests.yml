name: Coordinator Tests
permissions: {}

on:
  push:
    branches:
      - develop
    paths:
      - "common/**"
      - "crypto/**"
      - "networks/**"
      - "secret-store/**"
      - "message-queue/**"
      - "coordinator/**"
      - "orchestration/**"
      - "tests/docker/**"
      - "tests/coordinator/**"

  pull_request:
    paths:
      - "common/**"
      - "crypto/**"
      - "networks/**"
      - "secret-store/**"
      - "message-queue/**"
      - "coordinator/**"
      - "orchestration/**"
      - "tests/docker/**"
      - "tests/coordinator/**"

  workflow_dispatch:

jobs:
  test-coordinator:
    name: e2e tests for the coordinator (`tests/coordinator`)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # 6.0.0
        with:
          persist-credentials: false

      - name: Install Build Dependencies
        uses: ./.github/actions/build-dependencies

      - name: Run coordinator Docker tests
        run: cargo test --all-features -p serai-coordinator-tests
