name: Coordinator Tests

on:
  push:
    branches:
      - develop
    paths:
      - "common/**"
      - "crypto/**"
      - "networks/**"
      - "message-queue/**"
      - "coordinator/**"
      - "orchestration/**"
      - "tests/docker/**"
      - "tests/coordinator/**"

  pull_request:
    paths:
      - "common/**"
      - "crypto/**"
      - "networks/**"
      - "message-queue/**"
      - "coordinator/**"
      - "orchestration/**"
      - "tests/docker/**"
      - "tests/coordinator/**"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # 6.0.0

      - name: Install Build Dependencies
        uses: ./.github/actions/build-dependencies

      - name: Run coordinator Docker tests
        run: cargo test --all-features -p serai-coordinator-tests
