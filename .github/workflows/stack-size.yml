name: Check `increase_default_stack_size.sh`
permissions: {}

on:
  push:
    paths:
      - "orchestration/increase_default_stack_size.sh"
  pull_request:
    paths:
      - "orchestration/increase_default_stack_size.sh"
  workflow_dispatch:
  # Also run weekly to ensure this doesn't inadvertently decay
  schedule:
    - cron: "0 0 * * 1"

jobs:
  stack_size:
    name: Check `increase_default_stack_size.sh`
    strategy:
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, ubuntu-24.04, ubuntu-22.04, macos-26-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # 7.0.0
        with:
          go-version: stable

      - name: Monero Daemon Cache
        id: cache-monerod
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
        with:
          path: monerod
          key: stack-size-monerod

      - name: Download the Monero Daemon
        if: steps.cache-monerod.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # We explicitly download the Linux binary as this script executes over an ELF binary
          wget https://downloads.getmonero.org/cli/monero-linux-x64-v0.18.5.1.tar.bz2
          tar -xvf monero-linux-x64-v0.18.5.1.tar.bz2
          mv $(find . -name monerod) .

      - name: Verify expected behavior
        shell: bash
        run: |
          STACK=$((8 * 1024 * 1024))

          OS=${{ runner.os }}
          if [ "$OS" = "Linux" ]; then
            sudo apt update -y

            SHELLS="sh"

            sudo apt install -y ksh bash dash zsh posh yash
            SHELLS="$SHELLS ksh bash dash zsh posh yash"

            wget http://ftp.us.debian.org/debian/pool/main/g/gash/gash_0.3.2-2_amd64.deb
            sudo apt install ./gash_0.3.2-2_amd64.deb
            rm ./gash_0.3.2-2_amd64.deb
            SHELLS="$SHELLS gash"

            sudo apt install -y mksh
            SHELLS="$SHELLS mksh lksh"

            sudo apt install -y build-essential

            git clone https://git.busybox.net/busybox --branch 1_38_0 --depth 1
            cd busybox
            make defconfig
            sed -i s/"CONFIG_TC=y"/"CONFIG_TC=n"/ .config # Requires specific Linux headers
            make
            cp $(find . -type f -executable -name busybox) /usr/local/bin/busybox
            sudo ln -s /usr/local/bin/busybox /usr/local/bin/ash
            sudo ln -s /usr/local/bin/busybox /usr/local/bin/hush
            cd ..
            rm -rf ./busybox
            SHELLS="$SHELLS ash hush"

            git clone https://github.com/dimkr/loksh
            cd loksh
            git checkout 1147bbb51c633186287414bb04048261e55fc95f
            sudo apt install -y meson ninja-build
            meson --prefix=/usr/local build
            ninja -C build
            cp $(find . -type f -executable -name "ksh") /usr/local/bin/loksh
            cd ..
            rm -rf ./loksh
            SHELLS="$SHELLS loksh"

            git clone https://github.com/hvdijk/gwsh
            cd gwsh
            git checkout 34192339cb35f8720ac46ab8cd2ba23f2cba6cab
            rm ./configure
            sudo apt install -y automake
            sh ./autogen.sh
            ./configure
            make
            sudo make install
            cd ..
            rm -rf ./gwsh
            SHELLS="$SHELLS gwsh"

            mkdir schily
            cd schily
            sudo apt install -y curl
            curl -L https://sourceforge.net/projects/schilytools/files/schily-2021-09-18.tar.bz2/download -o schily.tar.bz2
            tar -xf schily.tar.bz2
            cd schily-2021-09-18
            cd psmake
            sh ./MAKE-all
            cd ..
            ./psmake/smake CFLAGS="--std=c17" -r all
            cp $(find . -type f -executable -name bsh) /usr/local/bin
            cp $(find . -type f -executable -name obosh) /usr/local/bin
            cp $(find . -type f -executable -name pbosh) /usr/local/bin
            cd ../..
            rm -rf ./schily
            SHELLS="$SHELLS bsh obosh pbosh"
          fi
          if [ "$OS" = "macOS" ]; then
            brew install binutils # `readelf`

            # `binutils` is not placed within the path, so find its
            # `readelf` bin and manually move it into our path
            HOMEBREW_ROOT_PATH=/opt/homebrew # Apple Silicon
            if [ $(uname -m) = "x86_64" ]; then HOMEBREW_ROOT_PATH=/usr/local; fi # Intel
            sudo cp $(find "$HOMEBREW_ROOT_PATH" -name readelf) /usr/local/bin/

            # macOS has the benefit of packaging `oksh`, `osh`, and having distinct core tools
            # TODO: `posh` is packaged but doesn't work: https://github.com/serai-dex/serai/issues/703
            brew install ksh93 bash dash-shell zsh mksh oksh yash oils-for-unix
            SHELLS="sh ksh bash dash zsh mksh oksh yash osh"
          fi

          # Install shells available via `cargo`
          cargo +1.98.1 install --locked brush-shell --version =0.2.23
          SHELLS="$SHELLS brush"
          cargo +1.98.1 install --locked nsh --version =0.4.2
          SHELLS="$SHELLS nsh"

          # Install shells available via `go`
          GOBIN=/usr/local/bin go install github.com/u-root/u-root/cmds/core/gosh@eadd8c6fee2e915e8f331b1c532be4ac98ba2a05
          # `gosh` doesn't support specifying commands via the CLI so we wrap it with a script which
          # pipes to its `stdin`
          echo 'echo "$@" | sed s/"^-c "// | gosh' > gosh2
          chmod +x ./gosh2
          export PATH="$PATH:$(pwd)"
          SHELLS="$SHELLS gosh2"

          # Patch with `muslstack`
          cp monerod monerod-muslstack
          GOBIN=$(pwd) go install github.com/yaegashi/muslstack@d19cc5866abce3ca59dfc1666df7cc97097d0933
          ./muslstack -s "$STACK" ./monerod-muslstack

          # Patch with `chelf`, which only works on a Linux host (due to requiring `elf.h`)
          # TODO: Install the header on macOS so `chelf` may be used as the source of truth
          if [ "$OS" = "Linux" ]; then
            cp monerod monerod-chelf
            git clone https://github.com/Gottox/chelf
            cd chelf
            git checkout b2994186cea7b7d61a588fd06c1cc1ae75bcc21a
            make
            ./chelf -s "$STACK" ../monerod-chelf
            cd ..
          fi

          # Run our script with all installed shells
          for shell in $SHELLS; do
            echo "Executing \`$shell\`"

            cp monerod monerod-idss-$shell
            $shell -c "./orchestration/increase_default_stack_size.sh monerod-idss-$shell"

            # Run as `sh` as some shells have distinct behavior (less extensions) when so invoked
            cp monerod monerod-idss-$shell-sh
            ln -s "$(which $shell)" sh
            ./sh -c "./orchestration/increase_default_stack_size.sh monerod-idss-$shell-sh"
            rm ./sh
          done

          # Verify they all had the same result
          sha256() {
            sha256sum "$1" | cut -d' ' -f1
          }
          CHELF=$(sha256 monerod-muslstack)
          find . -name "monerod-*" | while read -r bin; do
            BIN=$(sha256 "$bin")
            if [ ! "$CHELF" = "$BIN" ]; then
              echo "Different artifact between \`monerod-muslstack\` ($CHELF) and \`$bin\` ($BIN)"
              exit 1
            fi
          done

          # Verify the integrity of the result
          read_stack() {
            STACK_INFO=$(readelf "$1" -l | grep STACK -A1)
            MEMSZ=$(printf "%s\n" "$STACK_INFO" | tail -n1 | sed -E s/^[[:space:]]*//g | cut -f2 -d' ')
            printf "%i" $((MEMSZ))
          }
          INITIAL_STACK=$(read_stack monerod)
          if [ "$INITIAL_STACK" -ne "0" ]; then
            echo "Initial \`PT_GNU_STACK\` wasn't 0"
            exit 2
          fi

          UPDATED_STACK=$(read_stack monerod-muslstack)
          if [ "$UPDATED_STACK" -ne "$STACK" ]; then
            echo "Updated \`PT_GNU_STACK\` ($UPDATED_STACK) wasn't 8 MB ($STACK)"
            exit 3
          fi

          # Only one byte should be different due to the bit pattern of 8 MB
          BYTES_DIFFERENT=$(cmp -l monerod monerod-muslstack | wc -l || true)
          if [ "$BYTES_DIFFERENT" -ne 1 ]; then
            echo "More than one byte was different between the two binaries"
            exit 4
          fi
