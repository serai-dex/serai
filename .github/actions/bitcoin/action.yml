name: bitcoin-regtest
description: Spawns a regtest Bitcoin daemon

inputs:
  version:
    description: "Version to download and run"
    required: false

runs:
  using: "composite"
  steps:
    - name: Restore Bitcoin Daemon Cache
      id: cache-bitcoind
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
      with:
        path: bitcoind*
        key: bitcoind-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version || '31.0' }}

    - name: Download and Extract the Bitcoin Daemon
      if: steps.cache-bitcoind.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version || '31.0' }}
      run: |
        OS="${{ runner.os }}"
        ARCH="${{ runner.arch }}"

        OS=$(echo "${OS}" | tr "[:upper:]" "[:lower:]")
        ARCH=$(echo "${ARCH}" | tr "[:upper:]" "[:lower:]")
        EXT="tar.gz"

        if [ "${ARCH}" = "x64" ]; then
          ARCH="x86_64"
        fi

        if [ "${OS}" = "linux" ]; then
          OS="-linux-gnu"
        fi
        if [ "${OS}" = "macos" ]; then
          OS="-apple-darwin"
        fi
        if [ "${OS}" = "windows" ]; then
          ARCH=""
          OS="win64"
          EXT="zip"
        fi

        FILE="bitcoin-${VERSION}-${ARCH}${OS}.${EXT}"

        curl -L "https://bitcoincore.org/bin/bitcoin-core-${VERSION}/${FILE}" -o "${FILE}"

        if [ "${{ runner.os }}" = "Windows" ]; then
          unzip "${FILE}"
        else
          tar -xf "${FILE}"
        fi

        mv $(find . -type f -name "bitcoind*") .

    - name: Save Bitcoin Daemon Cache
      if: steps.cache-bitcoind.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # 6.1.0
      with:
        path: bitcoind*
        key: bitcoind-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version || '31.0' }}

    - name: Install the Bitcoin Daemon
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          TARGET="/C/Windows/System32/"
        else
          mkdir -p /usr/local/bin
          TARGET=/usr/local/bin/
        fi
        mv $(find . -type f -name "bitcoind*") "$TARGET"

    - name: Bitcoin Regtest Daemon
      shell: bash
      run: ./orchestration/dev/networks/bitcoin/run.sh -daemon
