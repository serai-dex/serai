[package]
name = "serai-processor-scheduler-test-primitives"
version = "0.1.0"
description = "Test primitives for the Serai processor's schedulers"
license = "AGPL-3.0-only"
repository = "https://github.com/serai-dex/serai/tree/develop/processor/scheduler/test-primitives"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
keywords = []
edition = "2024"
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
borsh = { version = "1", default-features = false, features = ["std", "derive", "de_strict_order"] }
rand_core = { version = "0.6", default-features = false }

ciphersuite = { path = "../../../crypto/ciphersuite", default-features = false, features = ["std"] }
dalek-ff-group = { path = "../../../crypto/dalek-ff-group", default-features = false, features = ["std"] }
frost = { package = "modular-frost", path = "../../../crypto/frost", default-features = false }

serai-primitives = { path = "../../../substrate/primitives", default-features = false, features = ["std"] }

primitives = { package = "serai-processor-primitives", path = "../../primitives" }
scanner = { package = "serai-processor-scanner", path = "../../scanner" }
scheduler-primitives = { package = "serai-processor-scheduler-primitives", path = "../primitives" }
utxo-scheduler-primitives = { package = "serai-processor-utxo-scheduler-primitives", path = "../utxo/primitives" }
