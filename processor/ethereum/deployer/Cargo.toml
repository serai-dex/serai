[package]
name = "serai-processor-ethereum-deployer"
version = "0.1.0"
description = "The deployer for Serai's Ethereum contracts"
license = "AGPL-3.0-only"
repository = "https://github.com/serai-dex/serai/tree/develop/processor/ethereum/deployer"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
edition = "2024"
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
alloy-core = { version = "1", default-features = false }

alloy-sol-types = { version = "1", default-features = false }
alloy-sol-macro = { version = "1", default-features = false }

alloy-consensus = { version = "2", default-features = false }

alloy-rpc-types-eth = { version = "2", default-features = false }
alloy-transport = { version = "2", default-features = false }
alloy-provider = { version = "2", default-features = false }

ethereum-primitives = { package = "serai-processor-ethereum-primitives", path = "../primitives", default-features = false }

[build-dependencies]
build-solidity-contracts = { path = "../../../networks/ethereum/build-contracts", default-features = false }

[dev-dependencies]
alloy-simple-request-transport = { path = "../../../networks/ethereum/alloy-simple-request-transport", default-features = false }
alloy-rpc-client = { version = "2", default-features = false }
alloy-node-bindings = { version = "2", default-features = false }

tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }

ethereum-test-primitives = { package = "serai-ethereum-test-primitives", path = "../test-primitives" }
