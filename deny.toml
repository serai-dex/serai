[advisories]
version = 2

db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

unsound = "all"
unmaintained = "all"
yanked = "deny"

ignore = [
  "RUSTSEC-2024-0436", # `paste` is unmaintained
  "RUSTSEC-2026-0173", # `proc-macro-error2` is unmaintained
]

[licenses]
version = 2

include-dev = true
include-build = true

allow = [
  # Effective public domain
  "CC0-1.0",
  "Unlicense",

  # Attribution required
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",

  # Non-invasive copyleft
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "GPL-3.0-or-later WITH Classpath-exception-2.0",
]

exceptions = [
