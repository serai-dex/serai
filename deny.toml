[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
  { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
deny = [
  # Contains a non-reproducible binary blob
  # https://github.com/serde-rs/serde/pull/2514
  # https://github.com/serde-rs/serde/issues/2575
  { name = "serde_derive", version = ">=1.0.172, <1.0.185" },
  # Introduced an insecure implementation of `borsh` removed with `0.15.1`
  # https://github.com/rust-lang/hashbrown/issues/576
  { name = "hashbrown", version = "=0.15.0" },
  # Incorrect implementation of cSHAKE
  # https://github.com/RustCrypto/hashes/pull/834
  { name = "cshake", version = "<0.1.1" },
  { name = "sha3", version = ">=0.10.2, <0.10.9" },
  # Incorrect implementation of square roots
  # https://github.com/RustCrypto/crypto-bigint/issues/1303
  { name = "crypto-bigint", version = "=0.7.4" },

  # These re: `multihash` are explained by how we patch `core2` to our own `std-shims`

  # Pulls in `no_std_io2` as a replacement for `core2`
  { name = "multihash", version = "=0.19.4" },
  # Inlines `no_std_io2` (or comparable) to avoid a third-party dependency
  { name = "multihash", version = ">=0.19.5" },

  # Legacy which _no one_ should use anymore
  { name = "is-terminal", version = "*" },

  # Conflicts with our usage of mimalloc
  # https://github.com/serai-dex/serai/issues/690
  { name = "tikv-jemalloc-sys", version = "*" },

  # https://github.com/libp2p/rust-libp2p/issues/6222
  { name = "libp2p-floodsub", version = "*" },
]

[bans.std-replacements]
scope = "all"
ignore-rust-version = "all"
# TODO
ignore = [
  "cfg-if",
  "itoa",
  "num_cpus",
  "once_cell",
  "pin-utils"
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/kayabaNerve/hickory-dns",
  "https://github.com/kayabaNerve/elliptic-curves",
  "https://github.com/monero-oxide/monero-oxide",
  "https://github.com/serai-dex/patch-polkadot-sdk",
]
