[advisories]
version = 2

db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

yanked = "deny"

ignore = [
  "RUSTSEC-2024-0370", # `proc-macro-error` is unmaintained, in-tree due to Substrate/`litep2p`
  "RUSTSEC-2024-0436", # paste is unmaintained
]

[licenses]
version = 2

allow = [
  # Effective public domain
  "CC0-1.0",
  "Unlicense",

  # Attribution required
  "MIT",
  "MITNFA",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",

  # Non-invasive copyleft
  # "MPL-2.0", # Commented as it's not currently in-use within the Serai tree
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "GPL-3.0-or-later WITH Classpath-exception-2.0",
]

exceptions = [
  { allow = ["AGPL-3.0-only"], name = "serai-env" },
  { allow = ["AGPL-3.0-only"], name = "serai-task" },

  { allow = ["AGPL-3.0-only"], name = "ethereum-schnorr-contract" },
