[package]
name = "bitcoin-serai"
version = "0.4.0"
description = "A Bitcoin library for FROST-signing transactions"
license = "MIT"
repository = "https://github.com/serai-dex/serai/tree/develop/networks/bitcoin"
authors = ["Luke Parker <lukeparker5132@gmail.com>", "Vrx <vrx00@proton.me>"]
edition = "2021"
rust-version = "1.89"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-machete]
ignored = ["bitcoin-units"]

[lints]
workspace = true

[dependencies]
std-shims = { version = "0.1.1", path = "../../common/std-shims", default-features = false, features = ["alloc"] }

thiserror = { version = "2", default-features = false }

subtle = { version = "2", default-features = false }
zeroize = { version = "^1.5", default-features = false }
rand_core = { version = "0.6", default-features = false }

# `FeeRate::from_sat_per_vb_u32`
bitcoin-units = { version = "0.1.3", default-features = false }
# - `0.32.4` relaxed `BufRead` bounds to `Read`, which we need
# - `0.32.8` specifies `hex-conservative 0.2.2`, when we need at least `0.2.1`
#    as `0.2.0` specifies `arrayvec 0.7.0` but needs `arrayvec 0.7.2`
#    (which `0.2.1` fixed).
bitcoin = { version = "0.32.8", default-features = false }

k256 = { version = "^0.13.1", default-features = false, features = ["arithmetic", "bits"] }
frost = { package = "modular-frost", path = "../../crypto/frost", version = "0.11", default-features = false, features = ["secp256k1"] }

core-json-traits = { version = "0.4", default-features = false, features = ["alloc"], optional = true }
core-json-derive = { version = "0.4", default-features = false, optional = true }
simple-request = { path = "../../common/request", version = "0.3", default-features = false, features = ["tokio", "tls", "basic-auth"], optional = true }

[dev-dependencies]
frost = { package = "modular-frost", path = "../../crypto/frost", features = ["tests"] }

tokio = { version = "1", features = ["macros"] }

[features]
std = [
  "std-shims/std",

  "thiserror/std",

  "subtle/std",
  "zeroize/std",
  "rand_core/std",

  "bitcoin/std",

  "k256/std",
  "frost/std",
]
rpc = [
  "std",
  "dep:core-json-traits",
  "dep:core-json-derive",
  "dep:simple-request",
]
default = ["std", "rpc"]
