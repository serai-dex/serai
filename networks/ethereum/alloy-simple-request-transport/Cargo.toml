[package]
name = "alloy-simple-request-transport"
version = "0.1.1"
description = "A transport for alloy based off simple-request"
license = "MIT"
repository = "https://github.com/serai-dex/serai/tree/develop/networks/ethereum/alloy-simple-request-transport"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
edition = "2024"
rust-version = "1.91"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
tower = "0.5.1"

# `alloy-json-rpc` requires `serde_json 1.0.107` but only specifies `serde_json 1`
serde_json = { version = "1.0.107", default-features = false }
simple-request = { path = "../../../common/request", version = "0.3", default-features = false, features = ["tokio"] }

alloy-json-rpc = { version = "2", default-features = false }
alloy-transport = { version = "2", default-features = false }

[features]
default = ["tls"]
tls = ["simple-request/tls"]
